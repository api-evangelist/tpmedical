name: SMTP Technology
description: SMTP Technology Co., Ltd. (Beijing Shuimu Tianpeng Medical Technology,
  tpmedical.com) is a Beijing Zhongguancun-based medical device company founded in
  2010 that develops, manufactures, and sells ultrasonic surgical equipment - including
  the ultrasonic osteotome (bone scalpel), Ultrasonic Osteotomy Surgical System, ultrasonic
  aspirator, and ultrasonic hemostatic surgical systems - with market authorization
  in China, the EU, and the USA, and is a drafter of the YY/T 1601-2018 industry standard
  for ultrasonic bone-tissue surgical devices. A Qiming Venture Partners healthcare
  portfolio company. Enrichment probing found a brochure-only website (HTTP-only,
  unreachable outside China; profiled via its September 2025 Wayback snapshot) with
  no public developer API, SDK, developer portal, or event surface.
